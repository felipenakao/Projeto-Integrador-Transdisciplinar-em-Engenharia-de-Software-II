services:
  - type: web
    name: cupcakes-gourmet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O plano gratuito não tem Shell, então criamos as tabelas e os dados iniciais ao iniciar.
    # O comando é seguro para repetir: só cria o que ainda não existe.
    startCommand: flask seed && gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakes-db
          property: connectionString
databases:
  - name: cupcakes-db
    plan: free
