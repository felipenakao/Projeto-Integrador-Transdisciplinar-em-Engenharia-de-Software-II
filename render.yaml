services:
  - type: web
    name: cupcakes-gourmet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakes-db
          property: connectionString
databases:
  - name: cupcakes-db
    plan: free
