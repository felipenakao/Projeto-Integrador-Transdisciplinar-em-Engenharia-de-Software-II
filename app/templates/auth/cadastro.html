{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" value="{{ form.get('nome', '') }}" autocomplete="name" required>
    <label for="email">E-mail</label>
    <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
    <label for="telefone">Telefone (com DDD)</label>
    <input id="telefone" type="tel" name="telefone" value="{{ form.get('telefone', '') }}" placeholder="(11) 99999-9999" autocomplete="tel" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" name="senha" autocomplete="new-password" required>
    <small>Mínimo de 8 caracteres, com letras e números.</small>
    <label for="confirmar_senha">Confirmar senha</label>
    <input id="confirmar_senha" type="password" name="confirmar_senha" autocomplete="new-password" required>
    <button class="btn" type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
